<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elliott Ashby</title>
    <meta name="description" content="Elliott Ashby: GitHub, LinkedIn, CV and contact.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://elliott-ashby.uk/">
    <meta property="og:title" content="Elliott Ashby">
    <meta property="og:description" content="Elliott Ashby: GitHub, LinkedIn, CV and contact.">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="https://elliott-ashby.uk/">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap">
    <link rel="stylesheet" href="style.css">
    <script>
        // Set the theme before first paint: saved choice, else the OS preference.
        let savedTheme = null;
        try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
        document.documentElement.dataset.theme = savedTheme
            || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
</head>

<body>
    <main class="container">
        <h1>Elliott Ashby</h1>
        <nav class="links">
            <a href="https://github.com/Aethar01" target="_blank">GitHub</a>
            <a href="https://linkedin.com/in/elliott-ashby-292145307" target="_blank">LinkedIn</a>
            <a href="assets/CV.pdf" target="_blank">CV</a>
        </nav>
        <a class="email" href="mailto:elliott.c.ashby@gmail.com">elliott.c.ashby@gmail.com</a>
        <img class="logo" src="assets/ket_psi.svg" alt="|ψ⟩" width="100">
    </main>

    <button id="theme-toggle" aria-label="Toggle dark mode">🌓</button>
    <script>
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = theme;
            try { localStorage.setItem('theme', theme); } catch (e) {}
        });
    </script>
</body>
</html>
